# Chosen 2026-10-24 from the live OpenRouter list (free + tool support) and local Ollama.
# Free models only. Tried and dropped: gemma-4-31b-it and gemma-4-26b-a4b-it (429 on every
# retry), laguna-xs-2.1 (answers in prose, not the JSON the agent needs), inkling (403, only
# served to specific agent products).

[[model]]
name = "nemotron-3.5-lightning"
provider = "openrouter"
model_id = "nvidia/nemotron-3.5-lightning:free"

[[model]]
name = "nemotron-3-ultra-550b"
provider = "openrouter"
model_id = "nvidia/nemotron-3-ultra-550b-a55b:free"

[[model]]
name = "north-mini-code"
provider = "openrouter"
model_id = "cohere/north-mini-code:free"

[[model]]
name = "qwen3-4b-local"
provider = "ollama"
model_id = "qwen3:4b"

[[model]]
name = "llama3.2-3b-local"
provider = "ollama"
model_id = "llama3.2:3b"
